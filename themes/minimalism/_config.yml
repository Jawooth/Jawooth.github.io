# ============================================================
#  ⚠ 这个文件不是给你改的。
#     要改站，请打开仓库根目录的：  _config.minimalism.yml
#  ------------------------------------------------------------
#  本文件 = 主题自带的「默认值」。Hexo 的加载顺序是：
#
#        themes/minimalism/_config.yml  ← 本文件（默认值）
#                    ↓ 被覆盖
#        _config.minimalism.yml         ← 你的设置（优先）
#
#  所以：只要 _config.minimalism.yml 里也写了同一个键，
#  你在这里做的修改就会被无声地覆盖掉 —— 现象就是「改了没反应」。
#  结论：只改 _config.minimalism.yml，本文件留作查阅。
#
#  这里原本还有一小段示例菜单，指向本站并不存在的 /about、/tags 页面。
#  已删除：万一有人清空 _config.minimalism.yml 的 menu，
#  那段示例菜单就会顶上来产生死链。现在没有示例，就没有这种意外。
# ============================================================

# 深色主题
dark_theme:
  enable: true
  mode: auto # 可选 auto、dark

# 联系方式
contact:
  github: ""
  twitter:
  weibo:
  zhihu:
  facebook:
  email:
  bluesky:

# 首页头像图片
avatar: /images/avatar.png

# 站点图标
favicon: /favicon.ico

# 谷歌统计 跟踪 ID
ga:

# 百度统计 The baidu web analytics
baidu_tongji:

comment:
  enable: false
  system: twikoo # 可选 gitalk、twikoo
  config:
    gitalk:
      clientId:
      clientSecret:
      repository: # 仓库名
      owner: # 仓库所有者
      createIssueManually: false
    twikoo:
      envId:
      region:
      mark:

# 底部链接
bottom_link:
  rss:
    url:
    text: RSS
  icp:
    url:
    text:

# 底部显示来源信息
bottom_source:
  enable: true

# 脚注
footnote:
  enable: true # 是否开启脚注解析
  ignoreCodeBlock: false # 是否忽略代码块中的脚注

# 图片配置
image:
  lazyload_enable: true # 图片懒加载
  lazyload_placeholder: # 图片懒加载占位图
  photo_zoom: simple-lightbox # 可选 simple-lightbox、fancybox、false(禁用)

# cdn 配置
cdn:
  enable: false
  provider: jsdelivr # 可选 jsdelivr、unpkg、bootcdn

search:
  enable: false # 是否启用搜索
  type: algolia # 可选：json 或 algolia
  placeholder: 输入关键词搜索...
  algolia:
    appID: ''
    apiKey: ''
    indexName: ''
