      title = document.title || '文章';

  // ========== 开始菜单 ==========
  var startBtn = null;
  var startMenu = null;

  function toggleStartMenu() {
    if (!startMenu) startMenu = document.getElementById('xpStartMenu');
    if (!startMenu) return;
    startMenu.classList.toggle('show');
  }

  function closeStartMenu(e) {
    if (!startMenu) startMenu = document.getElementById('xpStartMenu');
    if (!startMenu || !startBtn) return;
    if (!startMenu.contains(e.target) && !startBtn.contains(e.target)) {
      startMenu.classList.remove('show');
    }
  }

  // ========== 深色模式切换 ==========
  function toggleDarkMode() {
    var html = document.documentElement;
    var isDark = html.classList.contains('dark');
    if (isDark) {
      html.classList.remove('dark');
      localStorage.setItem('use-color-scheme', 'light');
    } else {
      html.classList.add('dark');
      localStorage.setItem('use-color-scheme', 'dark');
    }
  }

  // 初始化：读取 localStorage 中的主题设置
  function initTheme() {
    var saved = localStorage.getItem('use-color-scheme');
    var html = document.documentElement;
    if (saved === 'dark') {
      html.classList.add('dark');
    } else if (saved === 'light') {
      html.classList.remove('dark');
    }
    // 如果没有保存，保持默认（跟随系统）
  }

  // ========== 杂谈页注入待办事项 ==========
  function injectTodoToBlog() {
    var path = window.location.pathname;
    var cleanPath = path.replace(/index\.html$/, '');
    if (cleanPath !== '/blog/' && cleanPath !== '/blog') return;

    var container = document.querySelector('.content-container');
    if (!container) return;

    var todoHTML =
      '<div class="xp-window blog-todo-window">' +
        '<div class="xp-window-title">' +
          '<span class="xp-window-title-text">' +
            '<svg class="inline-icon" width="14" height="14" viewBox="0 0 16 16">' +
              '<rect x="2" y="1" width="12" height="14" rx="1" fill="#fff" stroke="#003399" stroke-width="0.5"/>' +
              '<rect x="2" y="1" width="12" height="3" rx="1" fill="#0066cc" stroke="#003399" stroke-width="0.5"/>' +
              '<rect x="4" y="5.5" width="2" height="2" fill="#66cc66" stroke="#003399" stroke-width="0.8"/>' +
              '<path d="M4.5 6.5l1 1 2-2" fill="none" stroke="#fff" stroke-width="0.8"/>' +
              '<line x1="7" y1="6.5" x2="12" y2="6.5" stroke="#003399" stroke-width="0.6"/>' +
              '<rect x="4" y="8.5" width="2" height="2" fill="none" stroke="#003399" stroke-width="0.8"/>' +
              '<line x1="7" y1="9.5" x2="12" y2="9.5" stroke="#003399" stroke-width="0.6"/>' +
              '<rect x="4" y="11.5" width="2" height="2" fill="none" stroke="#003399" stroke-width="0.8"/>' +
              '<line x1="7" y1="12.5" x2="12" y2="12.5" stroke="#003399" stroke-width="0.6"/>' +
            '</svg>' +
            ' 待办清单' +
          '</span>' +
          '<span class="xp-window-btns"><i class="xp-window-btn">_</i><i class="xp-window-btn">□</i><i class="xp-window-btn close">×</i></span>' +
        '</div>' +
        '<div class="xp-window-body">' +
          '<ul class="todo-mini-list">' +
            '<li><input type="checkbox" checked disabled> <span class="done">完成个人网站搭建</span></li>' +
            '<li><input type="checkbox" checked disabled> <span class="done">学习 Hexo 基础使用</span></li>' +
            '<li><input type="checkbox" disabled> <span>学习插画基础</span></li>' +
            '<li><input type="checkbox" disabled> <span>写一篇网站建设教程</span></li>' +
            '<li><input type="checkbox" disabled> <span>上传更多作品</span></li>' +
          '</ul>' +
        '</div>' +
      '</div>';

    // 插入到内容区最前面
    container.insertAdjacentHTML('afterbegin', todoHTML);
  }

  // ========== 初始化 ==========
  function init() {
    setCurrentPage();
    initTheme();
    injectTodoToBlog();

    startBtn = document.getElementById('xpStartBtn');
    startMenu = document.getElementById('xpStartMenu');

    if (startBtn) {
      startBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        toggleStartMenu();
      });
    }

    // 点击别处关闭开始菜单
    document.addEventListener('click', closeStartMenu);

    // 深色模式切换按钮
    var themeBtn = document.getElementById('xpThemeBtn');
    if (themeBtn) {
      themeBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        toggleDarkMode();
      });
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
