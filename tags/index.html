<script>
(function () {
  if (window.__XP_MUSIC_INITED__) return;
  window.__XP_MUSIC_INITED__ = true;

  if (window.XP_MUSIC_EMBED) return;

  var songs = window.XP_MUSIC || [];
  var S = 'xp_music_state_v1';        /* 主状态：index/progress/playing/order */
  var SP = S + '_p';                  /* 位置 */
  var SC = S + '_c';                  /* 折叠 */
  var SH = S + '_h';                  /* 隐藏 */
  var SS = S + '_s';                  /* 大小档位：0=小 1=标准 2=大 */
  var $ = function (id) { return document.getElementById(id); };
  var index = 0, ap = null, isPlaying = false;

  function fmt(sec) {
    sec = Math.max(0, sec || 0);
    var m = Math.floor(sec / 60), s = Math.floor(sec % 60);
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }

  function load() { try { return JSON.parse(localStorage.getItem(S) || 'null'); } catch (e) { return null; } }
  function save() {
    if (!ap) return;
    try {
      localStorage.setItem(S, JSON.stringify({
        i: index, p: ap.audio ? ap.audio.currentTime : 0, playing: isPlaying,
        order: songs.map(function (s) { return String(s.title || '') + '||' + String(s.author || ''); })
      }));
    } catch (e) {}
  }

  /* ---- 拖动 ---- */
  var dragging = false, dragOffX = 0, dragOffY = 0;
  function enableDrag() {
    var brand = document.querySelector('.mp4-brand');
    var box = document.getElementById('xp-music-floating');
    if (!brand || !box) return;
    brand.style.cursor = 'move';
    brand.addEventListener('mousedown', function (e) {
      /* 点按钮/链接/窗口控件不触发拖动（用 closest 捕获 SVG 图标内的点击） */
      if (e.target && e.target.closest && e.target.closest('button, a, .xp-window-btn, .mp4-btn')) return;
      dragging = true;
      var rect = box.getBoundingClientRect();
      dragOffX = e.clientX - rect.left;
      dragOffY = e.clientY - rect.top;
      e.preventDefault();
    });
    document.addEventListener('mousemove', function (e) {
      if (!dragging) return;
      var w = box.offsetWidth, h = box.offsetHeight;
      var maxX = window.innerWidth - w - 4, maxY = window.innerHeight - h - 4;
      var x = Math.max(4, Math.min(maxX, e.clientX - dragOffX));
      var y = Math.max(4, Math.min(maxY, e.clientY - dragOffY));
      box.style.left = x + 'px'; box.style.top = y + 'px';
      box.style.right = 'auto'; box.style.bottom = 'auto';
      try { localStorage.setItem(SP, JSON.stringify({ l: x, t: y })); } catch (e) {}
    });
    document.addEventListener('mouseup', function () { dragging = false; });
    /* 触屏也支持拖动 */
    brand.addEventListener('touchstart', function (e) {
      if (e.target && e.target.closest && e.target.closest('button, a, .xp-window-btn, .mp4-btn')) return;
      var t = e.touches[0];
      var rect = box.getBoundingClientRect();
      dragOffX = t.clientX - rect.left; dragOffY = t.clientY - rect.top;
      dragging = true;
    }, { passive: true });
    document.addEventListener('touchmove', function (e) {
      if (!dragging) return;
      e.preventDefault();   /* 拖播放器期间阻止页面跟着滚（必须配 passive:false 才能调用，2026-10-13） */
      var t = e.touches[0];
      var w = box.offsetWidth, h = box.offsetHeight;
      var maxX = window.innerWidth - w - 4, maxY = window.innerHeight - h - 4;
      var x = Math.max(4, Math.min(maxX, t.clientX - dragOffX));
      var y = Math.max(4, Math.min(maxY, t.clientY - dragOffY));
      box.style.left = x + 'px'; box.style.top = y + 'px';
      box.style.right = 'auto'; box.style.bottom = 'auto';
      try { localStorage.setItem(SP, JSON.stringify({ l: x, t: y })); } catch (e) {}
    }, { passive: false });
    document.addEventListener('touchend', function () { dragging = false; });
  }

  function restorePosition() {
    var box = document.getElementById('xp-music-floating');
    if (!box) return;
    try {
      var p = JSON.parse(localStorage.getItem(SP) || 'null');
      if (p && typeof p.l === 'number' && typeof p.t === 'number') {
        box.style.left = p.l + 'px'; box.style.top = p.t + 'px';
        box.style.right = 'auto'; box.style.bottom = 'auto';
      }
    } catch (e) {}
  }

  /* ---- 隐藏 / 恢复 ---- */
  function hidePlayer() {
    var box = document.getElementById('xp-music-floating');
    var dot = document.getElementById('xp-music-resume');
    if (box) box.classList.add('mp4-hidden');
    if (dot) dot.style.display = '';
    try { localStorage.setItem(SH, '1'); } catch (e) {}
  }
  function showPlayer() {
    var box = document.getElementById('xp-music-floating');
    var dot = document.getElementById('xp-music-resume');
    if (box) { box.classList.remove('mp4-hidden'); box.classList.remove('mp4-collapsed'); }
    if (dot) dot.style.display = 'none';
    try { localStorage.removeItem(SH); } catch (e) {}
  }
  function restoreHidden() {
    try { if (localStorage.getItem(SH) === '1') hidePlayer(); } catch (e) {}
  }

  /* ---- 大小调节（2026-10-13）：小 / 标准 / 大 三档循环，档位存 LocalStorage ----
     用整体 transform 缩放：不动内部布局，拖动、折叠、隐藏都照常工作。
     播放器常驻右下角，以右下角为缩放原点 —— 变小往角落收、变大往左上伸，不会跑出屏幕。 */
  var SCALE_STEPS = [0.8, 1, 1.25];
  function applyScale(step) {
    var el = document.getElementById('xp-music-floating');
    if (!el) return;
    var v = SCALE_STEPS[((step % SCALE_STEPS.length) + SCALE_STEPS.length) % SCALE_STEPS.length];
    el.style.transform = v === 1 ? '' : 'scale(' + v + ')';
    el.style.transformOrigin = 'bottom right';
  }
  function restoreSize() {
    var s = -1;
    try { s = parseInt(localStorage.getItem(SS), 10); } catch (e) {}
    if (s >= 0 && s < SCALE_STEPS.length) applyScale(s);
  }

  /* ---- 歌名跑马灯 ---- */
  function marquee() {
    var inner = document.querySelector('.mp4-title-inner');
    if (!inner) return;
    inner.classList.remove('mp4-marquee');
    void inner.offsetWidth;
    if (inner.scrollWidth > inner.clientWidth + 2) inner.classList.add('mp4-marquee');
  }

  function renderEmpty() {
    var inner = document.querySelector('.mp4-title-inner');
    if (inner) inner.textContent = (window.XP_MUSIC_UI || {}).empty || '未配置曲目';
    ['mp4-play','mp4-prev','mp4-next'].forEach(function (id) {
      var b = $(id); if (b) { b.disabled = true; b.setAttribute('aria-disabled','true'); }
    });
    var link = $('mp4-link'); if (link) link.style.display = 'none';
    var bar = $('mp4-progress-bar');
    if (bar) { bar.style.cursor = 'default'; bar.removeAttribute('role'); }
    var screen = document.querySelector('.mp4-screen');
    if (screen) screen.classList.add('is-empty');
  }

  function neUrl(s) {
    if (!s || !s.url) return '';
    /* ⚠ DRIVER 是模板字符串：正则里的反斜杠必须写双份（\d），
       写单份会被模板字面量吃掉变成 d —— 2026-10-12 修复：该链接因此从未显示过 */
    var m = String(s.url).match(/[?&]id=(\d+)/);
    return m ? 'https://music.163.com/#/song?id=' + m[1] : '';
  }

  /* 封面图白名单（2026-10-12 审查加固）：
     song.pic 来自「网络抓取 → music-tracks.yml → 内联脚本」三级，直接拼进
     url("...") 等于给 CSS 注入留了口子（典型利用：加载外部资源做追踪 / 钓鱼背景）。
     只放行两类：
       1. 网易云封面 CDN：https://p1..p4.music.126.net/<base64 id>/<数字 id>.jpg
          （注意是两段路径，第一段含 = 号——实测漏掉中间那段会把真封面也挡掉）
       2. 站内相对路径（手填 music.yml 时可以用 /images/... 本地封面）
     其它一律当没有封面处理（回退到占位 SVG），neUrl() 的同款思路。 */
  var PIC_CDN_RE = /^https:\/\/p[1-4]\.music\.126\.net\/[A-Za-z0-9_\-=]+\/\d+\.[A-Za-z]{3,4}$/;
  function safePic(p) {
    if (!p) return '';
    p = String(p).trim();
    if (PIC_CDN_RE.test(p)) return p;
    if (p.charAt(0) === '/' && !/:|\/\/|\.\./.test(p)) return p;
    return '';
  }

  function updateSongInfo(i) {
    var song = songs[i]; if (!song) return;
    var inner = document.querySelector('.mp4-title-inner');
    if (inner) inner.textContent = song.title || '';
    if ($('mp4-author')) $('mp4-author').textContent = song.author || '';
    var link = $('mp4-link');
    if (link) {
      var t = neUrl(song);
      if (t) { link.href = t; link.style.display = ''; }
      else { link.style.display = 'none'; }
    }
    var cover = $('mp4-cover');
    if (cover) {
      var ph = cover.querySelector('svg');
      var pic = safePic(song.pic);
      if (pic) {
        cover.style.backgroundImage = 'url("' + pic + '")';
        cover.style.backgroundSize = 'cover';
        cover.style.backgroundPosition = 'center';
        cover.classList.add('has-cover');
        if (ph) ph.style.display = 'none';
      } else {
        cover.style.backgroundImage = '';
        cover.classList.remove('has-cover');
        if (ph) ph.style.display = '';
      }
    }
    setTimeout(marquee, 0);
  }

  function setPlaying(playing) {
    isPlaying = playing;
    var p = $('icon-play'), pu = $('icon-pause'), dot = $('mp4-play-indicator');
    if (p) p.style.display = playing ? 'none' : '';
    if (pu) pu.style.display = playing ? '' : 'none';
    if (dot) dot.style.display = playing ? 'inline-block' : 'none';
    var btn = $('mp4-play'); if (btn) btn.setAttribute('aria-label', playing ? '暂停' : '播放');
  }

  function initPlayer() {
    if (!songs.length || typeof APlayer === 'undefined') { renderEmpty(); return; }

    songs = songs.slice();
    var st = load();
    var savedIndex = 0, savedProg = 0, shouldPlay = false;

    /* 恢复洗牌顺序 */
    function ko(a) { return a.map(function (s) { return String(s.title || '') + '||' + String(s.author || ''); }); }
    var cur = ko(songs), restored = false;
    if (st && Array.isArray(st.order) && st.order.length === songs.length) {
      var set = {}; cur.forEach(function (k) { set[k] = true; });
      if (st.order.every(function (k) { return !!set[k]; })) {
        var map = {}; songs.forEach(function (s) { map[ko([s])[0]] = s; });
        songs = st.order.map(function (k) { return map[k]; }).filter(Boolean);
        restored = true;
      }
    }
    if (!restored) {
      for (var i = songs.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = songs[i]; songs[i] = songs[j]; songs[j] = t;
      }
    }

    if (st && typeof st.i === 'number' && st.i >= 0 && st.i < songs.length) {
      savedIndex = st.i; savedProg = st.p || 0; shouldPlay = !!st.playing;
    }

    ap = new APlayer({
      container: $('aplayer-hidden'),
      audio: songs.map(function (s) {
        return { name: s.title, artist: s.author, url: s.url, cover: s.pic || '' };
      }),
      volume: 0.7
    });
    index = savedIndex;
    if (index > 0) ap.switchAudio(index);
    updateSongInfo(index);

    ap.on('loadeddata', function () {
      if (savedProg > 0 && ap.audio && ap.audio.duration) {
        ap.seek(Math.min(savedProg, ap.audio.duration - 0.5));
      }
      if (shouldPlay) { ap.play(); }
      savedProg = 0; shouldPlay = false;
    });
    ap.on('listswitch', function (info) {
      if (info && typeof info.index === 'number') index = info.index;
      updateSongInfo(index); save();
    });
    var errC = 0;
    ap.on('error', function () { errC += 1; if (errC < songs.length) next(); });

    var last = 0;
    ap.on('timeupdate', function () {
      var c = ap.audio.currentTime || 0, t = ap.audio.duration || 0;
      if ($('mp4-current')) $('mp4-current').textContent = fmt(c);
      if ($('mp4-total')) $('mp4-total').textContent = fmt(t);
      if (t > 0) {
        var pct = (c / t) * 100;
        var f = $('mp4-progress-fill'); if (f) f.style.width = pct + '%';
        var b = $('mp4-progress-bar'); if (b) b.setAttribute('aria-valuenow', String(Math.round(pct)));
      }
      var now = Date.now();
      if (now - last > 2000) { save(); last = now; }
    });
    ap.on('ended', function () { next(); });
    ap.on('play', function () { isPlaying = true; setPlaying(true); save(); });
    ap.on('pause', function () { isPlaying = false; setPlaying(false); save(); });

    /* 按钮绑定 */
    if ($('mp4-play')) $('mp4-play').addEventListener('click', toggle);
    if ($('mp4-prev')) $('mp4-prev').addEventListener('click', prev);
    if ($('mp4-next')) $('mp4-next').addEventListener('click', next);
    var close = $('mp4-close');
    if (close) close.addEventListener('click', function () {
      var box = document.getElementById('xp-music-floating');
      if (box) {
        box.classList.toggle('mp4-collapsed');
        try { localStorage.setItem(SC, box.classList.contains('mp4-collapsed') ? '1' : '0'); } catch (e) {}
      }
    });
    var hide = $('mp4-hide');
    if (hide) hide.addEventListener('click', hidePlayer);
    var resume = $('xp-music-resume');
    if (resume) resume.addEventListener('click', showPlayer);
    var sizeBtn = $('mp4-size');
    if (sizeBtn) sizeBtn.addEventListener('click', function () {
      var cur = 0;
      try { cur = parseInt(localStorage.getItem(SS), 10) || 0; } catch (e) {}
      cur = (cur + 1) % SCALE_STEPS.length;
      try { localStorage.setItem(SS, String(cur)); } catch (e) {}
      applyScale(cur);
    });

    var bar = $('mp4-progress-bar');
    if (bar) bar.addEventListener('click', function (e) {
      if (!ap || !ap.audio.duration) return;
      var r = bar.getBoundingClientRect();
      ap.seek(((e.clientX - r.left) / r.width) * ap.audio.duration);
    });

    /* 恢复持久化状态 */
    try {
      var box = document.getElementById('xp-music-floating');
      var saved = localStorage.getItem(SC);
      if (saved === '1') {
        if (box) box.classList.add('mp4-collapsed');
      } else if (saved === null && box &&
                 window.matchMedia && window.matchMedia('(max-width: 640px)').matches) {
        /* 移动端首次访问默认收起（2026-10-12 审查建议）：播放器 max-width 320px
           在 500px 屏上接近半屏，收起态只留品牌条 + 封面缩略 + 控制条。
           注意只在「从未手动设置过」时生效——老访客的展开/收起偏好优先。 */
        box.classList.add('mp4-collapsed');
      }
    } catch (e) {}

    restorePosition();
    restoreHidden();
    restoreSize();
    enableDrag();
  }

  function toggle() { if (!ap) return; isPlaying ? ap.pause() : ap.play(); }
  function prev() {
    if (!ap) return;
    index = (index - 1 + songs.length) % songs.length;
    ap.switchAudio(index); updateSongInfo(index);
    if (isPlaying) ap.play();
  }
  function next() {
    if (!ap) return;
    index = (index + 1) % songs.length;
    ap.switchAudio(index); updateSongInfo(index);
    if (isPlaying) ap.play();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initPlayer);
  else initPlayer();
})();
</script>

<script>(function(){
  if (window.__XP_WIN_ACTIONS__) return;

  /* 全站窗口统一补齐右上角三按钮（2026-10-13）：
     模板里没写按钮组的窗口（侧栏卡片、各页面窗口等）在这里一次性补上，
     已经有按钮组的窗口跳过。交互不用逐个绑定 —— 走下面的 document 事件委托，
     新插入的按钮天然可用，键盘 Enter/Space 也一样。 */
  (function fillWindowButtons() {
    var MIN = '<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><rect x="1" y="7" width="8" height="2" fill="currentColor"/></svg>';
    var MAX = '<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><rect x="1" y="1" width="8" height="8" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>';
    var CLOSE = '<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M1 1l8 8M9 1l-8 8" stroke="currentColor" stroke-width="1.4" fill="none"/></svg>';
    document.querySelectorAll('.xp-window').forEach(function (win) {
      var title = win.querySelector('.xp-window-title');
      if (!title || title.querySelector('.xp-window-btns')) return;
      var span = document.createElement('span');
      span.className = 'xp-window-btns';
      span.setAttribute('role', 'group');
      span.setAttribute('aria-label', '窗口操作');
      span.innerHTML =
        '<i class="xp-window-btn" data-action="min" role="button" tabindex="0" aria-label="最小化">' + MIN + '</i>' +
        '<i class="xp-window-btn" data-action="max" role="button" tabindex="0" aria-label="最大化">' + MAX + '</i>' +
        '<i class="xp-window-btn close" data-action="close" role="button" tabindex="0" aria-label="关闭">' + CLOSE + '</i>';
      title.appendChild(span);
    });
  })();

  /* close 不再一关了之（2026-10-12 审查新增）：XP 原语义是「关闭直到刷新」，
     误点一次窗口就回不来。现在关闭后在左下角（任务栏上方）留一枚「恢复」chip，
     点一下窗口就回来；多关几个就叠几枚，全部恢复后条自动消失（CSS :empty 隐藏）。 */
  function restoreBar() {
    var bar = document.getElementById('xp-restore-bar');
    if (!bar) {
      bar = document.createElement('div');
      bar.id = 'xp-restore-bar';
      document.body.appendChild(bar);
    }
    return bar;
  }
  function titleOf(win) {
    var t = win.querySelector('.xp-window-title-text, .xp-window-title');
    return (t && t.textContent || '').trim() || '窗口';
  }
  function closeWindow(win) {
    if (win.hasAttribute('data-xp-closed')) return;
    win.setAttribute('data-xp-closed', '1');
    var chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'xp-restore-chip';
    var name = titleOf(win);
    chip.textContent = '恢复「' + name + '」';
    chip.title = name + ' —— 点击恢复窗口';
    chip.setAttribute('aria-label', '恢复窗口 ' + name);
    chip.addEventListener('click', function () {
      win.removeAttribute('data-xp-closed');
      chip.remove();
    });
    restoreBar().appendChild(chip);
  }

  function act(btn) {
    var win = btn.closest('.xp-window');
    if (!win) return;
    var a = btn.getAttribute('data-action');
    if (a === 'min') win.classList.toggle('is-minimized');
    else if (a === 'max') win.classList.toggle('is-maximized');
    else if (a === 'close') closeWindow(win);
  }
  document.addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('.xp-window-btn') : null;
    if (b) act(b);
  });
  /* 键盘操作：Enter / Space 触发 */
  document.addEventListener('keydown', function(e){
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var b = document.activeElement;
    if (b && b.classList && b.classList.contains('xp-window-btn')) {
      e.preventDefault(); act(b);
    }
  });
})();</script>

<script>
(function() {
  // ========== 时钟（时间 + 日期） ==========
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function updateClock() {
    var now = new Date();
    var timeEl = document.getElementById('xpClockTime');
    var dateEl = document.getElementById('xpClockDate');
    if (timeEl) timeEl.textContent = pad(now.getHours()) + ':' + pad(now.getMinutes());
    if (dateEl) dateEl.textContent = (now.getMonth() + 1) + '月' + now.getDate() + '日';
  }
  updateClock();
  setInterval(updateClock, 15000);

  // ========== 当前页面标题与图标 ==========
  var ICON_DOC = '<svg viewBox="0 0 16 16" width="14" height="14" class="xp-taskbar-icon" aria-hidden="true"><path d="M3 1h7l3 3v11H3V1z" fill="#ffffff" stroke="#003399" stroke-width="1"/><path d="M10 1v3h3" fill="none" stroke="#003399" stroke-width="1"/><line x1="5" y1="7" x2="11" y2="7" stroke="#003399" stroke-width="1"/><line x1="5" y1="9" x2="11" y2="9" stroke="#003399" stroke-width="1"/><line x1="5" y1="11" x2="9" y2="11" stroke="#003399" stroke-width="1"/></svg>';
  function setCurrentPage() {
    var path = window.location.pathname.replace(/index\.html$/, '');
    var pages = {
      '/': '首页', '/works/': '作品', '/games/': '游戏/工具', '/guides/': '攻略教程',
      '/blog/': '杂谈', '/archives/': '归档',
      '/tags/': '标签', '/categories/': '分类'
    };
    var title = pages[path] || document.title || '页面';
    var titleEl = document.getElementById('xpTaskbarTitle');
    if (titleEl) titleEl.textContent = title;
    var item = document.getElementById('xpTaskbarItem');
    if (item) item.setAttribute('title', title);
  }
  setCurrentPage();

  // ========== 开始菜单 ==========
  var startBtn = document.getElementById('xpStartBtn');
  var startMenu = document.getElementById('xpStartMenu');

  function setMenu(open) {
    if (!startMenu) return;
    startMenu.classList.toggle('show', open);
    if (startBtn) startBtn.setAttribute('aria-expanded', String(open));
  }
  function toggleStartMenu() {
    if (!startMenu) return;
    setMenu(!startMenu.classList.contains('show'));
  }
  function onDocumentClick(e) {
    if (!startMenu || !startMenu.classList.contains('show')) return;
    if (!startMenu.contains(e.target) && !(startBtn && startBtn.contains(e.target))) setMenu(false);
  }

  if (startBtn) {
    startBtn.addEventListener('click', function(e) { e.stopPropagation(); toggleStartMenu(); });
  }
  document.addEventListener('click', onDocumentClick);
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') setMenu(false);
  });

  // ========== 深色模式 ==========
  function applyThemeUI(isDark) {
    var sun = document.getElementById('xpThemeSun');
    var moon = document.getElementById('xpThemeMoon');
    var btn = document.getElementById('xpThemeBtn');
    if (sun) sun.style.display = isDark ? 'none' : '';
    if (moon) moon.style.display = isDark ? '' : 'none';
    if (btn) btn.setAttribute('aria-pressed', String(isDark));
  }
  function toggleDarkMode() {
    var html = document.documentElement;
    var isDark = html.classList.toggle('dark');
    try { localStorage.setItem('use-color-scheme', isDark ? 'dark' : 'light'); } catch (err) {}
    applyThemeUI(isDark);
  }
  var themeBtn = document.getElementById('xpThemeBtn');
  if (themeBtn) {
    themeBtn.addEventListener('click', function(e) { e.stopPropagation(); toggleDarkMode(); });
  }
  applyThemeUI(document.documentElement.classList.contains('dark'));

  // ========== 托盘音量：静音 / 取消静音（对所有音频生效） ==========
  var muted = false;
  function applyMute() {
    var media = document.querySelectorAll('audio, video');
    for (var i = 0; i < media.length; i++) media[i].muted = muted;
    var on = document.getElementById('xpVolOn');
    var off = document.getElementById('xpVolOff');
    var btn = document.getElementById('xpVolumeBtn');
    if (on) on.style.display = muted ? 'none' : '';
    if (off) off.style.display = muted ? '' : 'none';
    if (btn) btn.setAttribute('aria-pressed', String(muted));
  }
  var volBtn = document.getElementById('xpVolumeBtn');
  if (volBtn) {
    volBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      muted = !muted;
      applyMute();
    });
  }
})();
</script>
