# state: doing(进行中) | todo(待做) | done(已完成)   —— 只能填这三种，写别的会静默算成「待做」
# url:   可选字段。填了就变成可点击的直达链接 —— 站内写 /works/ 这类路径，
#        站外写完整 https://…（自动新标签页打开并带小箭头）；不填就是纯文字，排版不变。
# 显示顺序固定：进行中 → 待做 → 已完成
