# ============================================================
#  你的身份与介绍（唯一真源）
#  ------------------------------------------------------------
#  首页「用户账户」卡片、关于页、文章/列表页侧栏的「关于我」都读这个文件，
#  改一处三处同步变化，不需要再去改页面里的文字。
# ============================================================

# 头像：把图片放到 source/images/ 下，然后改这里。
# ⚠️ 不要用 /images/avatar.png —— 那是主题自带的占位图，会被它覆盖。
avatar: /images/site-avatar.png

# 首页大标题会渲染成「<greeting> <name>」，例如「你好，我是 Jawooth」
greeting: 你好，我是
name: Jawooth

# 侧栏「关于我」卡片里的一句话简介（留空则用下面的 tagline）
bio: 像素风个人角落，画点画、写点东西、做点小玩意。

# 首页卡片里的正文段落（想加几段就加几段）
tagline: 这里是我的像素风个人角落，存放着画作、攻略、小游戏和碎碎念。
intro:
  - 欢迎随便逛逛，像操作 XP 桌面一样点击各个小窗口~

# 首页的小胶囊。key 是从站点自动统计的数字（posts/tags/works/months…），
# 也可以直接写 value: "∞" 这样的固定文字。
chips:
  - key: works
    label: 作品
  - key: tags
    label: 标签
  - value: "∞"
    label: 灵感

# 首页卡片上的按钮
buttons:
  - text: 关于我
    url: /about/
  - text: 作品集
    url: /works/
  - text: 小游戏
    url: /games/

# 联系方式：留空的项目不会显示
contacts:
  github: https://github.com/Jawooth
  email: ""

# 「关于」页面的文案
about:
  title: 你好，欢迎来到我的小站！
  paragraphs:
    - 这里是我的个人角落，存放着我的画作、攻略、小游戏和一些碎碎念。
    - 站点整体采用 Windows XP 桌面风格，希望给你带来一点复古又温馨的感觉。
  chips:
    - 像素风
    - 绘画
    - 游戏
  contact_desc: 欢迎来 GitHub 找我，或者去首页逛逛：
