# ============================================================
#  你的身份与介绍（唯一真源）
#  ------------------------------------------------------------
#  首页「用户账户」卡片、各页侧栏的「关于我」都读这个文件，
#  改一处两处同步变化，不需要再去改页面里的文字。
#
#  怎么改：用记事本打开本文件，只改冒号后面的内容（保留缩进和冒号）。
#  改完必须「清理 + 生成」并重启预览服务器，否则看不到变化。
#  每个字段的完整说明（能填什么、不填会怎样）见 CONTENT-GUIDE.md 第 2 节。
# ============================================================

# 头像：把图片放到 source/images/ 下，然后改这里。
# ⚠️ 不要用 /images/avatar.png —— 那是主题自带的占位图，会被它覆盖。
avatar: /images/site-avatar.png

# 首页大标题：渲染成「<网名> 来了！」
#   names 里想放几个放几个，页面每次打开随机取一个；
#   想让它在页面停留时也定时轮换，把 name_rotate_seconds 设成秒数（0 = 只在刷新时随机）。
#   列表里的第一个名字同时用于侧栏「关于我」的用户名与头像 alt 文本。
names:
  - 奇世俗人
  - 誩梧肆
  - 用户EE45E4
name_suffix: 来了！
name_rotate_seconds: 0

# 侧栏「关于我」卡片里的一句话简介（留空则用下面的 tagline）
bio: 像素风个人角落，画点画、写点东西、做点小玩意。

# 首页卡片里的正文段落（想加几段就加几段）
tagline: 这里是我的像素风个人角落，存放着画作、攻略、小游戏和碎碎念。
intro:
  - 欢迎随便逛逛，像操作 XP 桌面一样点击各个小窗口~

# 首页的小胶囊（当前首页已换成图标行，这里留作备用：
# 想把胶囊加回来就在 source/index.md 里放 {% xp_profile_chips %}）
chips:
  - key: works
    label: 作品
  - key: tags
    label: 标签
  - value: "∞"
    label: 灵感

# 备用：首页的文字按钮。现在首页用的是下面的图标行，
# 想把按钮换回来就把 source/index.md 里的 {% xp_profile_icons %} 改成 {% xp_profile_buttons %}
buttons:
  - text: 关于本站
    url: /#about
  - text: 作品集
    url: /works/
  - text: 小游戏
    url: /games/

# 首页「用户账户」里的图标行：填了地址的才显示，留空就隐藏。
# 支持的键：github / email / bilibili / xiaohongshu / x / weibo / pixiv / website
#   email（邮箱）可以写多个地址：写成列表，每个前面可以加个标签。
#     有多个地址时，点击信封图标会弹出一个小窗列出全部地址；
#     只有一个地址时，点图标直接就是发信。下面三种写法都认：
#       email:
#         - 个人：me@example.com       # 字符串里带标签（全角/半角冒号都行）
#         - 工作: work@example.com
#         - backup@example.com         # 不加标签也行
#   xiaohongshu 填你的小红书主页链接（App：我 → 右上角 → 分享主页 → 复制链接）
#   其它平台的键没填就自动不显示
contacts:
  github: https://github.com/Jawooth
  email:
    - 主要：2917129582@qq.com
    - 次要：Jawooth@gmail.com
    - 如果有人需要：Jawooth2917@163.com
  bilibili: https://b23.tv/FWf3XB1
  xiaohongshu: https://xhslink.cn/o/5iSJjTT5dHC
  x: https://x.com/Jawooth
  weibo: ""
  pixiv: ""
  website: ""

# 站点说明（显示在首页底部「搜索 · 关于本站 · 致谢」窗口中间那一段）
# 注意：这里不要再写「个人角落/存放着画作、攻略…」之类的自我介绍，
# 那句话在首页「用户账户」卡片的 tagline 里已经有了，重复会出现两遍。
about:
  paragraphs:
    - 站点整体采用 Windows XP 桌面风格，希望给你带来一点复古又温馨的感觉。
  chips:
    - 像素风
    - 绘画
    - 游戏
  # 下面这句是「邮箱弹窗」里的说明文字（只有一个邮箱时不弹窗，这句也就用不上）
  contact_desc: 想聊两句、约稿或者交换链接，可以发邮件：
