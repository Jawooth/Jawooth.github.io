# ============================================================
#  作品页的「栏目」与「时间轴分期」
#  ------------------------------------------------------------
#  这两个列表以前写死在 scripts/xp-content.js 里（注释还写着「想改分期就改这里」，
#  可那个文件是代码）。现在搬到这里：改作品页的分期/栏目，只改这一个文件。
#
#  怎么改：用记事本打开，只改冒号后面和引号里的字，保留缩进和短横线。
#  改完生效：关掉预览窗口 → 双击「2 重新生成.cmd」→ 双击「3 看效果.cmd」
# ============================================================

# 栏目（作品页顶部那两个切换按钮）
#   文章里写 origin: 同人 就归到「同人」，没写或写了别的都算「原创」。
#   顺序就是按钮顺序；第一个是默认选中的那个。
origins:
  - 原创
  - 同人

# 时间轴分期
#   from 含、to 不含（左闭右开）；最后一档 to 写成 null 表示「至今」。
#   「最新的一档」默认展开，其余默认折叠。
#   想让某篇作品单独归到某一期，在文章 front matter 里写 era: 期名 即可覆盖。
eras:
  - label: 远古期
    from: '0000-01-01'
    to: '2024-01-01'
  - label: 2024 年
    from: '2024-01-01'
    to: '2025-01-01'
  - label: 2025 年
    from: '2025-01-01'
    to: '2026-01-01'
  - label: 2026 年上半年
    from: '2026-01-01'
    to: '2026-06-01'
  - label: 2026 年 6-10 月
    from: '2026-06-01'
    to: null
