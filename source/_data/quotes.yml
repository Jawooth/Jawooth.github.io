# 首页便签上的句子（只改这个文件就够了）
#
# rotate_seconds：每隔多少秒自动换一句；填 0 表示只在每次刷新页面时随机取一句。
# quotes：想放几句放几句，顺序随意。
#   text —— 句子内容。气泡高度会自动跟着文字长短变（不会比最短的还矮，
#           也不会高过右边的「用户账户」窗口）；超过上限的部分会被裁掉，
#           所以一句建议不超过 60 字。
#   from —— 出处。三种写法都行：
#             from: 王姐0732      → 显示成「—— 王姐0732」
#             from: ''            → 不显示出处那一行
#             整行都不写           → 同样不显示
#           也就是：不想写来源，就留空或删掉这一行，不会再冒出默认文字。
#
# quote_left / quote_right：句子两侧的符号。
#   · 不写这两行 = 用默认的「 和 」
#   · 写成一对空字符串 '' = 完全不要符号（只要符号，不要空格，里面什么都别填）
#     注意：不能只写引号本身，例如 quote_left: '"' 会被 YAML 当成语法错误；
#     要用单引号把双引号包起来，或者改用「『』" 这类全角符号。
#   · 想换别的：例如 quote_left: '『'  quote_right: '』'
#
# 提示：本文件是 UTF-8。改完生效：关掉预览窗口 → 双击「1 开始使用.cmd」→ 按 2 看效果。

rotate_seconds: 12
quote_left: ''
quote_right: ''

