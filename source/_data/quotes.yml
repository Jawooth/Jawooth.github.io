# 首页便签上的句子（只改这个文件就够了）
#
# rotate_seconds：每隔多少秒自动换一句；填 0 表示只在每次刷新页面时随机取一句。
# quotes：想放几句放几句，顺序随意。
#   text —— 句子内容（建议不超过 60 字，便签格子高度固定，太长会被裁掉）
#   from —— 出处（没有就留空字符串）

rotate_seconds: 12

quotes:
  - text: 于是我驻足享受无法复制的瞬间。
    from: 网易云热评
  - text: 我们开始一起攀登，这长长的，长长的坡道。
    from: 《Clannad》
  - text: 人生就是一列开往坟墓的列车，路途上会有很多站，很难有人可以自始至终陪着走完。
    from: 《千与千寻》
  - text: 我们终其一生，就是要摆脱他人的期待，找到真正的自己。
    from: 《无声告白》
  - text: 世界上只有一种真正的英雄主义，那就是认清生活的真相后依然热爱生活。
    from: 罗曼·罗兰
  - text: 生活不止眼前的苟且，还有诗和远方的田野。
    from: 高晓松
