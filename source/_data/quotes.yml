# 首页便签上的句子（只改这个文件就够了）
#
# 显示顺序：**随机**。页面每次打开随机抽一句；点首页头像换下一句时也是随机抽，
# 并且会自动避开当前这句（免得连抽两次同一句、看着像「没反应」）。
# quotes 列表的书写顺序不影响显示，想放几句放几句。
#
# rotate_seconds：每隔多少秒自动换一句（同样是随机换）。填 0 = 不自动轮换
# （2026-10-12 起改成 0：句子改为「点击首页头像」刷新，顺带触发头像弹跳和鸭叫音效）。
#   text —— 句子内容。★ 2026-10-18 第四个版本的现状：
#           首页便利贴**宽度固定**（桌面端占 3 栏），**高度随句子长短自己长**，
#           上限 = 右边「用户账户」卡的高度（桌面端最矮 210px，见 xp-custom.css 里
#           --bubble-bento-max 的说明）。手机/窄屏（≤900px）整行堆叠，高度不设限。
#           能装多少字：1400 宽 ≈ 每行 16 字 × 6 行；1000 宽 ≈ 每行 12 字 × 6 行。
#           所以**单句控制在 90 字以内**，最长的那句（「哇咔哇咔…」63 字）现在已经顶到
#           上限了 —— 再长的句子会被纸面切掉末尾。
#           （高度是「内容量」决定的，同一句话在宽屏上矮、在窄屏上高，属于预期行为。）
#   from —— 出处。三种写法都行：
#             from: 王姐0732      → 显示成「—— 王姐0732」
#             from: ''            → 不显示出处那一行
#             整行都不写           → 同样不显示
#           也就是：不想写来源，就留空或删掉这一行，不会再冒出默认文字。
#
# quote_left / quote_right：句子两侧的符号。
#   · 不写这两行 = 用默认的「 和 」
#   · 写成一对空字符串 '' = 完全不要符号（只要符号，不要空格，里面什么都别填）
#     注意：不能只写引号本身，例如 quote_left: '"' 会被 YAML 当成语法错误；
#     要用单引号把双引号包起来，或者改用「『』" 这类全角符号。
#   · 想换别的：例如 quote_left: '『'  quote_right: '』'
#
# 提示：本文件是 UTF-8。改完生效：关掉预览窗口 → 双击「1 开始使用.cmd」→ 按 2 看效果。

rotate_seconds: 0
quote_left: ''
quote_right: ''

