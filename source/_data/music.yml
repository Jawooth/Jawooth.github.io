# 首页 XP-MP4 播放器 —— 配置说明（改完记得 npm run build 或客户端【清理】+【生成】）
#
# ── 方式 1（最推荐）：网易云歌单 → 站内自带播放器 ──
#   把歌单 id 填到下面的 netease_playlist（**只要数字**，不要贴整条链接，
#   也不要填 creatorId —— 那是用户 id，不是歌单 id），然后运行一次：
#
#       python tools/fetch-netease.py
#
#   它会生成 source/_data/music-tracks.yml（封面 / 歌名 / 歌手 / 直链），首页就用
#   自带那个 XP 播放器播放这些歌：外观是「封面 + 歌名 + 换歌 + 进度条」，
#   比网易云官方外链那个歌单列表好看得多。
#   ⚠️ 能放的是免费/可试听的歌；VIP、版权或地区受限的会被自动跳过（脚本会告诉你跳过了几首）。
#   ⚠️ 有曲目列表时，会优先用曲目；下面的 id 只是工具的输入，不会直接嵌 iframe。
#
# ── 方式 2：自己的歌 / 本地文件 ──
#   把 tracks 的 [] 换成曲目列表即可：
#   tracks:
#     - title: 曲目名
#       author: 艺术家
#       album: 专辑名
#       url: /music/song.mp3          # 也可以填 https:// 开头的直链
#       pic: /images/covers/song.jpg  # 可选，封面图
tracks: []

# 网易云歌单 id（方式 1 的输入；留空则不启用歌单相关功能）
netease_playlist: '18472717518'

# ── 方式 3：网易云官方外链播放器（歌单列表样式，约 430px 高，不套 XP 皮肤）──
#   只有在**没有**任何曲目列表时，才会用这个 iframe 播放上面的歌单。
#   歌单必须公开；私密歌单无法嵌入（会提示歌单不存在）。

# ── 播放器上的文字（随便改）──
player_title: 'XP-MP4'          # 播放器窗口顶上的标题
player_empty_text: '未配置曲目'   # 没配置任何曲目时的提示文字
