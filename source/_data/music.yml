# 首页 XP-MP4 播放器 —— 两种模式，二选一（填完记得 npm run build 或客户端【清理】+【生成】）
#
# 模式 A：本地音频 / 直链（外观是 XP 风格的自定义播放器，不依赖任何第三方）
#   把下面 tracks 的 [] 换成曲目列表即可（键名照抄）：
#   tracks:
#     - title: 曲目名
#       author: 艺术家
#       album: 专辑名
#       url: /music/song.mp3          # 也可以填 https:// 开头的直链
#       pic: /images/covers/song.jpg  # 可选，封面图
tracks: []

# 模式 B：网易云歌单（用网易云官方外链播放器，外观不套 XP 皮肤）
#   ⚠️ 只填「歌单 id」这一串数字，不要贴整条链接：
#       https://music.163.com/#/playlist?id=3778678   →   填 3778678
#   ⚠️ 歌单必须是「公开」的：私密歌单无法被嵌入，会提示歌单不存在。
#   ⚠️ 填在这里（不要填在上面的注释行里，注释是不生效的）。
#   ⚠️ 注意事项：需要联网、依赖网易云服务；别人能不能听到取决于歌曲版权与地区。
netease_playlist: ''

# 两种都不填 = 首页播放器显示「未配置曲目」，且不会加载任何第三方脚本。
